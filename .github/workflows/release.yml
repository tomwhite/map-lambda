name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag is the package's version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME isn't v$version, the version in pyproject.toml"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: uv sync --locked
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - run: uv tool install cargo-lambda
      - run: uv run python -m map_lambda.deploy build dist
      - run: cp map_lambda/deploy/*.sha256 dist/
      - uses: actions/upload-artifact@v4
        with:
          name: zips
          path: dist

  wheels:
    name: wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: zips
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
    steps:
      - uses: actions/checkout@v7
      # So a deploy can check it gets the zips built with this wheel.
      - uses: actions/download-artifact@v4
        with:
          name: zips
          path: ${{ runner.temp }}/zips
      - run: cp "$RUNNER_TEMP"/zips/*.sha256 map_lambda/deploy/
        shell: bash
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # ring's assembly needs a newer GCC than manylinux2014's.
          manylinux: 2_28
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  release:
    needs: [zips, wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in
            *dev* | *a[0-9]* | *b[0-9]* | *rc*) flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"

  # Deploying from a wheel downloads the zips from the GitHub release.
  pypi:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
