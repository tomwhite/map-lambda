site_name: map-lambda
site_description: A highly-scalable parallel Python map function running on Rust AWS lambdas.
site_url: https://tomwhite.github.io/map-lambda/
repo_url: https://github.com/tomwhite/map-lambda
repo_name: tomwhite/map-lambda
edit_uri: edit/main/

nav:
  - Overview: index.md
  - Usage: usage.md
  - Deployment: deployment.md
  - Development: development.md
  - API reference: api.md
  - Blog:
      - blog/index.md

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - blog
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
