[package]
name = "map-lambda-client"
version = "0.1.0"
edition = "2021"

[lib]
name = "map_lambda_client"
path = "src/lib.rs"

[dependencies]
async-stream = "0.3"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-lambda = "1"
aws-smithy-types = "1"
futures = "0.3"
map-lambda-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
