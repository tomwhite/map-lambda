[package]
name = "map-lambda-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
# Tested from Python, in tests/.
test = false
doctest = false

[dependencies]
futures = "0.3"
map-lambda-client = { path = "../client" }
pyo3 = { version = "0.29", features = ["abi3-py312"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde = "1"
serde_json = "1"
